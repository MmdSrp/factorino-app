name: Build APK
on:
  push: { branches: [main, master] }
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
            ALIAS="$KEY_ALIAS"; PASS="$KS_PASS"
          else
            echo "::warning::No keystore secret found; using a temporary key (not suitable for Bazaar updates)."
            ALIAS=factorino; PASS=factorino123
            keytool -genkeypair -v -keystore "$GITHUB_WORKSPACE/release.jks" -alias $ALIAS -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass $PASS -keypass $PASS -dname "CN=Shaerpour Team, O=Shaerpour, C=IR"
          fi
          printf "storeFile=%s/release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" "$GITHUB_WORKSPACE" "$PASS" "$ALIAS" "$PASS" > keystore.properties
      - run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Factorino-release-apk
          path: app/build/outputs/apk/release/*.apk
